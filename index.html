<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>NEON STRIDE // WebGPU 3-Lane Parkour Action</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Noto+Sans+JP:wght@700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <!-- Full-bleed WebGPU Canvas -->
      <canvas id="game-canvas" aria-label="NEON STRIDE 3D Parkour"></canvas>

      <!-- Dynamic Overdrive / Speed Vignette Overlay -->
      <div id="speed-vignette" class="speed-vignette"></div>

      <!-- Playing HUD -->
      <header id="hud" class="hud hidden" aria-live="polite">
        <div class="hud-left">
          <div class="glass-chip shields-chip" id="hud-shields" aria-label="シールド"></div>
          <div class="glass-chip speed-chip">
            <span id="hud-speed">104</span>
            <small>KM/H</small>
          </div>
          <div id="hud-backend" class="backend-pill">⚡ WebGPU</div>
        </div>

        <div class="hud-center">
          <div id="hud-combo" class="combo-badge hidden">
            <span id="hud-combo-num">x2</span>
            <small>COMBO</small>
          </div>
        </div>

        <div class="hud-right">
          <div class="glass-chip score-chip">
            <span class="score-label">SCORE</span>
            <strong id="hud-score">0</strong>
          </div>
          <button id="btn-toggle-pads" class="icon-btn" type="button" title="タッチパッド表示切替" aria-label="タッチパッド表示切替">
            🎮
          </button>
          <button id="btn-sound" class="icon-btn" type="button" title="サウンド切替" aria-label="サウンド切替">
            🔊
          </button>
        </div>
      </header>

      <!-- Floating Parkour Trick / Action Feed -->
      <div id="trick-feed" class="trick-feed" aria-live="polite"></div>

      <!-- Overdrive Gauge & Surge Trigger -->
      <div id="overdrive-dock" class="overdrive-dock hidden">
        <button id="btn-overdrive" class="overdrive-btn" type="button" aria-label="オーバードライブ発動">
          <div class="overdrive-bar-track">
            <div id="overdrive-bar-fill" class="overdrive-bar-fill"></div>
          </div>
          <span id="overdrive-label" class="overdrive-label">⚡ OVERDRIVE 0%</span>
        </button>
      </div>

      <!-- Ergonomic iPad / Mobile Split Thumb Pads (Always paired with full-screen instant swipe!) -->
      <div id="touch-pads" class="touch-pads hidden">
        <div class="thumb-cluster thumb-left">
          <button id="pad-left" class="thumb-btn" type="button" aria-label="左レーン">◀</button>
          <button id="pad-right" class="thumb-btn" type="button" aria-label="右レーン">▶</button>
        </div>
        <div class="thumb-cluster thumb-right">
          <button id="pad-jump" class="thumb-btn thumb-accent" type="button" aria-label="ジャンプ">▲</button>
          <button id="pad-slide" class="thumb-btn thumb-pink" type="button" aria-label="スライド / 急降下">▼</button>
        </div>
      </div>

      <!-- Title Overlay (Floats over live WebGPU 3D Orbit Camera!) -->
      <section id="title-screen" class="overlay-screen">
        <div class="title-panel">
          <div class="tech-tag">
            <span id="title-backend-badge">⚡ WebGPU + TSL BLOOM</span>
          </div>
          <h1 class="hero-title">NEON <span>STRIDE</span></h1>
          <p class="hero-sub">立体スカイウェイを縦横無尽に駆け抜ける 3レーン・パルクールアクション</p>

          <div class="move-chips">
            <div class="move-chip"><strong>◀ ▶ スワイプ</strong><span>レーン移動 / レール乗換</span></div>
            <div class="move-chip"><strong>▲ 上スワイプ</strong><span>ジャンプ / 2段フリップ / 壁蹴り</span></div>
            <div class="move-chip"><strong>▼ 下スワイプ</strong><span>スライディング / 空中急降下</span></div>
            <div class="move-chip"><strong>⚡ ゲージMAX</strong><span>オーバードライブ無敵突進</span></div>
          </div>

          <button id="btn-start" class="primary-cta" type="button">
            <span>▶ RUN</span>
          </button>

          <p class="best-line">BEST SCORE: <strong id="title-best">0</strong></p>
        </div>
      </section>

      <!-- Game Over Overlay -->
      <section id="gameover-screen" class="overlay-screen hidden">
        <div class="result-panel">
          <div class="result-kicker">RUN COMPLETE</div>
          <h2 id="result-headline" class="result-headline">STYLISH RUN!</h2>

          <div class="stats-grid">
            <div class="stat-tile">
              <span>SCORE</span>
              <strong id="res-score">0</strong>
            </div>
            <div class="stat-tile">
              <span>BEST</span>
              <strong id="res-best">0</strong>
            </div>
            <div class="stat-tile">
              <span>DISTANCE</span>
              <strong id="res-dist">0m</strong>
            </div>
            <div class="stat-tile">
              <span>MAX COMBO</span>
              <strong id="res-combo">x0</strong>
            </div>
            <div class="stat-tile">
              <span>TRICKS</span>
              <strong id="res-tricks">0</strong>
            </div>
            <div class="stat-tile">
              <span>ORBS</span>
              <strong id="res-orbs">0</strong>
            </div>
          </div>

          <div class="result-buttons">
            <button id="btn-retry" class="primary-cta" type="button">🔁 RETRY</button>
            <button id="btn-menu" class="ghost-btn" type="button">TITLE</button>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
